<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Tag Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #0f0; text-align: center; }
        .panel { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; }
        .controls { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 15px; }
        .controls label { font-weight: bold; }
        .controls input { width: 60px; padding: 5px; font-size: 16px; background: #333; color: white; border: 1px solid #555; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background: #0f0; border: none; border-radius: 5px; }
        button.reset { background: #f00; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background: #333; color: #0f0; }
        .DEAD { color: red; font-weight: bold; }
        .ALIVE { color: #0f0; font-weight: bold; }
        #conn-badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 14px; margin-left: 15px; }
        .badge-ok { background: #0f0; color: #000; }
        .badge-wait { background: yellow; color: #000; }
        .badge-dead { background: red; color: white; }
    </style>
</head>
<body>

    <h1>🚨 D-DAY ADMIN DASHBOARD 🚨 <span id="conn-badge" class="badge-wait">Connecting...</span></h1>

    <div class="panel">
        <h2 style="margin-top:0; color:#0f0;">Game Settings</h2>
        <div class="controls">
            <div>
                <label>Max Total Players: </label>
                <input type="number" id="maxPlayers" value="8" min="1">
            </div>
            <div>
                <label>Max Teams: </label>
                <input type="number" id="maxTeams" value="2" min="1">
            </div>
            <div>
                <label>Max Players per Team: </label>
                <input type="number" id="maxPerTeam" value="4" min="1">
            </div>
            <button onclick="updateSettings()">Apply Settings</button>
        </div>
        <button class="reset" onclick="resetGame()">🔥 RESET ALL PLAYERS (NEW MATCH) 🔥</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Player Name</th>
                <th>Marker ID</th>
                <th>Team</th>
                <th>HP</th>
                <th>Kills</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="playerTable">
            <tr><td colspan="6">Waiting for connection...</td></tr>
        </tbody>
    </table>

    <script>
        var SERVER_URL = 'wss://laser-tag-laser-tag-server.onrender.com';
        var ws = null;
        var reconnectDelay = 1000;
        var reconnectTimer = null;
        var badge = document.getElementById('conn-badge');
        var tableBody = document.getElementById('playerTable');

        function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            badge.className = 'badge-wait';
            badge.innerText = '⏳ Connecting...';

            try { ws = new WebSocket(SERVER_URL); } catch(e) { scheduleReconnect(); return; }

            ws.onopen = function() {
                badge.className = 'badge-ok';
                badge.innerText = '🟢 Online';
                reconnectDelay = 1000;
                ws.send(JSON.stringify({ type: "ADMIN_JOIN" }));
            };

            ws.onmessage = function(event) {
                var data;
                try { data = JSON.parse(event.data); } catch(e) { return; }

                if (data.type === "STATE_SYNC") {
                    updateTable(data.players);
                    if (data.settings) {
                        document.getElementById('maxPlayers').value = data.settings.max_players;
                        document.getElementById('maxTeams').value = data.settings.max_teams;
                        document.getElementById('maxPerTeam').value = data.settings.max_per_team;
                    }
                }
            };

            ws.onerror = function() {};

            ws.onclose = function() {
                badge.className = 'badge-dead';
                badge.innerText = '🔴 Disconnected';
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            badge.innerText = '🔄 Reconnecting...';
            reconnectTimer = setTimeout(function() {
                reconnectTimer = null;
                connect();
            }, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 2, 10000);
        }

        function resetGame() {
            if (confirm("Reset all players HP and kills to start a new match?")) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "ADMIN_RESET" }));
                } else {
                    alert("Not connected to server!");
                }
            }
        }

        function updateSettings() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "ADMIN_UPDATE_SETTINGS",
                    settings: {
                        max_players: parseInt(document.getElementById('maxPlayers').value),
                        max_teams: parseInt(document.getElementById('maxTeams').value),
                        max_per_team: parseInt(document.getElementById('maxPerTeam').value)
                    }
                }));
                alert("Settings Applied!");
            } else {
                alert("Not connected to server!");
            }
        }

        function updateTable(players) {
            tableBody.innerHTML = "";
            var count = 0;
            
            var sorted = Object.values(players)
                .filter(function(p) { return p.status !== "ADMIN"; })
                .sort(function(a, b) { return (b.kills || 0) - (a.kills || 0); });

            for (var i = 0; i < sorted.length; i++) {
                var p = sorted[i];
                count++;
                var tr = document.createElement("tr");
                tr.innerHTML = 
                    '<td>' + p.name + '</td>' +
                    '<td>' + p.marker_id + '</td>' +
                    '<td>' + (p.team || "SOLO") + '</td>' +
                    '<td>' + p.hp + '</td>' +
                    '<td>' + (p.kills || 0) + '</td>' +
                    '<td class="' + p.status + '">' + p.status + '</td>';
                tableBody.appendChild(tr);
            }

            if (count === 0) {
                tableBody.innerHTML = '<tr><td colspan="6">No players connected yet.</td></tr>';
            }
        }

        // Start connection on page load
        connect();
    </script>
</body>
</html>
