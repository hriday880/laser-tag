<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laser Tag Web Client</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: white; user-select: none; }
        #video, #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        #canvas { z-index: 10; pointer-events: none; }
        
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: none; }
        .hud-text { position: absolute; font-size: 6vw; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #hp { bottom: 5%; left: 5%; color: #0f0; }
        #ammo { bottom: 5%; right: 5%; color: #ff0; }
        #my-id-label { top: 5%; left: 5%; color: #fff; font-size: 4vw; opacity: 0.7; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10vw; height: 10vw; border: 3px solid #0f0; border-radius: 50%; }
        #crosshair::after { content: '+'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5vw; color: #0f0; }
        
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; z-index: 15; pointer-events: none; transition: opacity 0.1s; }
        #death-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 30; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #death-screen h1 { color: red; font-size: 10vw; margin: 0; }
        
        #setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #222; z-index: 40; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 35; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #scan-overlay h2 { color: #0f0; margin-bottom: 50px; text-shadow: 2px 2px 0 #000; }
        .scan-box { width: 50vw; height: 50vw; border: 4px dashed #0f0; border-radius: 20px; }

        input, select, button { font-size: 5vw; padding: 10px; border-radius: 5px; }
        button { background: #0f0; color: #000; border: none; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; }
        
        /* The invisible trigger covering the screen */
        #trigger-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 25; pointer-events: auto; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="damage-overlay"></div>
    
    <div id="setup-screen">
        <h2>Laser Tag Setup</h2>
        <input type="text" id="playerName" placeholder="Player Name" value="Player1">
        <select id="teamSelect">
            <option value="TEAM_RED">Red Team</option>
            <option value="TEAM_BLUE">Blue Team</option>
        </select>
        <button id="scanBtn" disabled>Loading OpenCV...</button>
    </div>

    <div id="scan-overlay">
        <h2>POINT CAMERA AT<br>YOUR VEST MARKER</h2>
        <div class="scan-box"></div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="my-id-label" class="hud-text">ID: ?</div>
        <div id="hp" class="hud-text">HP: 100</div>
        <div id="ammo" class="hud-text">AMMO: 10</div>
        <div id="trigger-zone"></div>
    </div>

    <div id="death-screen">
        <h1>YOU DIED</h1>
        <p id="respawn-timer">Respawning...</p>
    </div>

    <script src="cv.js"></script>
    <script src="aruco.js"></script>
    
    <script>
        // Game State
        const MAX_AMMO = 10;
        let ammo = MAX_AMMO;
        let hp = 100;
        let isDead = false;
        let myMarkerId = null;
        let ws;
        
        // JS-Aruco Detector
        let detector;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scanBtn = document.getElementById('scanBtn');
        const setupScreen = document.getElementById('setup-screen');
        const scanOverlay = document.getElementById('scan-overlay');
        const hud = document.getElementById('hud');
        const hpEl = document.getElementById('hp');
        const ammoEl = document.getElementById('ammo');
        const myIdLabel = document.getElementById('my-id-label');
        const crosshair = document.getElementById('crosshair');
        const damageOverlay = document.getElementById('damage-overlay');

        window.onload = () => {
            scanBtn.innerText = "START CAMERA & SCAN VEST";
            scanBtn.disabled = false;
        };

        scanBtn.onclick = async () => {
            setupScreen.style.display = 'none';
            scanOverlay.style.display = 'flex';
            
            // Start Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    detector = new AR.Detector();
                    // Begin scanning for our own vest marker
                    requestAnimationFrame(scanForVest);
                };
            } catch (err) {
                alert("Camera error: " + err.message + "\nMake sure you're using HTTPS or localhost!");
            }
        };

        function scanForVest() {
            if (canvas.width === 0) { requestAnimationFrame(scanForVest); return; }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let markers = detector.detect(imageData);
            
            if (markers.length > 0) {
                myMarkerId = markers[0].id;
                
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]); // Happy buzz
                
                scanOverlay.style.display = 'none';
                myIdLabel.innerText = `ID: ${myMarkerId}`;
                hud.style.display = 'block';
                
                connectWebSocket();
                return; // Stop scanning loop
            }
            
            requestAnimationFrame(scanForVest);
        }

        function connectWebSocket() {
            const serverIp = window.location.hostname || "localhost";
            ws = new WebSocket(`ws://${serverIp}:8765`);
            
            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: "JOIN",
                    player_name: document.getElementById('playerName').value,
                    marker_id: myMarkerId,
                    team: document.getElementById('teamSelect').value
                }));
            };
            
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === "DAMAGE_RECEIVED") {
                    takeDamage(msg.amount, msg.is_fatal);
                } else if (msg.type === "HIT_CONFIRMED") {
                    flashHitmarker();
                } else if (msg.type === "DEATH_EVENT") {
                    die(msg.respawn_timer_seconds);
                } else if (msg.type === "RESPAWN") {
                    respawn();
                }
            };
        }

        document.getElementById('trigger-zone').addEventListener('touchstart', fireWeapon, {passive: false});
        document.getElementById('trigger-zone').addEventListener('mousedown', fireWeapon);

        let lastTap = 0;
        document.getElementById('trigger-zone').addEventListener('touchend', (e) => {
            const currentTime = new Date().getTime();
            if (currentTime - lastTap < 300) { reload(); }
            lastTap = currentTime;
        });

        function fireWeapon(e) {
            e.preventDefault(); 
            if (isDead || ammo <= 0) return;
            
            ammo--;
            updateHUD();
            if (navigator.vibrate) navigator.vibrate(50); 
            
            processCVFrame();
        }
        
        function reload() {
            if (isDead) return;
            ammo = MAX_AMMO;
            updateHUD();
        }

        // Point-in-polygon algorithm for JS-Aruco corners
        function isPointInPoly(pt, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i].x, yi = poly[i].y;
                let xj = poly[j].x, yj = poly[j].y;
                let intersect = ((yi > pt.y) != (yj > pt.y)) && (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function processCVFrame() {
            if (canvas.width === 0) return;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let markers = detector.detect(imageData);
            
            let hitTarget = null;
            if (markers.length > 0) {
                let centerPoint = { x: canvas.width / 2, y: canvas.height / 2 };
                
                for (let i = 0; i < markers.length; i++) {
                    if (isPointInPoly(centerPoint, markers[i].corners)) {
                        hitTarget = markers[i].id;
                        break;
                    }
                }
            }
            
            if (hitTarget !== null && hitTarget >= 0) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "HIT_REPORT",
                        target_marker_id: hitTarget,
                        timestamp: Date.now()
                    }));
                }
            }
        }

        function takeDamage(amount, fatal) {
            hp = Math.max(0, hp - amount);
            updateHUD();
            
            damageOverlay.style.opacity = 0.5;
            setTimeout(() => { damageOverlay.style.opacity = 0; }, 150);
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function flashHitmarker() {
            crosshair.style.borderColor = "red";
            crosshair.style.color = "red";
            setTimeout(() => {
                crosshair.style.borderColor = "#0f0";
                crosshair.style.color = "#0f0";
            }, 150);
        }

        function die(respawnTime) {
            isDead = true;
            hp = 0;
            updateHUD();
            document.getElementById('death-screen').style.display = 'flex';
        }

        function respawn() {
            isDead = false;
            hp = 100;
            ammo = MAX_AMMO;
            updateHUD();
            document.getElementById('death-screen').style.display = 'none';
        }

        function updateHUD() {
            hpEl.innerText = `HP: ${hp}`;
            ammoEl.innerText = `AMMO: ${ammo}`;
        }
    </script>
</body>
</html>
